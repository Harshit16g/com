[workspace]
members = [
    "crates/shared",
    "crates/api_gateway",
    "crates/worker",
    "crates/scheduler",
    "crates/pool_manager",
    "crates/health_monitor", "apps/api-core", "apps/worker-core",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Redis
fred = { version = "9", features = ["enable-native-tls"] }
native-tls = "0.2"

# HTTP client (for Evolution API calls + Slack alerts)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Database (bundled Postgres via sqlx)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "derive"], default-features = false }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"
bcrypt = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config / env
dotenvy = "0.15"

# Random
rand = "0.8"

# Async utilities
async-trait = "0.1"
futures = "0.3"
