# ─── evo API — standalone, scale independently ─────────────────────────
# Each agency/partner can run their own evo API instance, or share one.
# Point WEBHOOK_GLOBAL_URL at the wa_api gateway.
#
# Usage:
#   docker compose -f docker-compose.evo.yml up -d
#   docker compose -f docker-compose.evo.yml up --scale evo_api=3 -d

services:

  # ─── evo API ─────────────────────────────────────────────────────────
  evo_api:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME_PREFIX:-harshit16g/leaex}-evo_api:${IMAGE_TAG:-latest}
    build:
      context: ../evo # local evo/ repo as build context
      dockerfile: ../wa_api/Dockerfile.evo # patched Dockerfile lives in wa_api/
    ports:
      - "${EVO_PORT:-8081}:8080"
    volumes:
      - evo_instances:/evo/instances
    networks:
      - wa_api_shared_net
    environment:
      SERVER_PORT: "8080"
      SERVER_URL: ${EVO_PUBLIC_URL:-http://localhost:8081}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://wa_api:${POSTGRES_PASSWORD:-wa_api_secret}@postgres:5432/wa_api?schema=evo
      AUTHENTICATION_API_KEY: ${EVO_API_KEY}
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${WA_API_WEBHOOK_URL:-http://api-core:8080}/webhook/evo
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
    restart: unless-stopped

networks:
  wa_api_shared_net:
    external: true
    name: wa_api_shared_net

volumes:
  evo_postgres_data:
  evo_instances:
