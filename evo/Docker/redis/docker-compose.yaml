version: '3.3'

services:
  redis:
    image: redis:latest
    networks:
      - evo-net
    container_name: redis
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - evo_redis:/data
    ports:
      - 6379:6379

volumes:
  evo_redis:


networks:
  evo-net:
    name: evo-net
    driver: bridge
