version: "3.8"

services:
  api:
    container_name: evo_api
    image: evoapicloud/evo-api:latest
    restart: always
    depends_on:
      - redis
      - evo-postgres
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evo_instances:/evo/instances
    networks:
      - evo-net
      - dokploy-network
    env_file:
      - .env
    expose:
      - "8080"

  frontend:
    container_name: evo_frontend
    image: evoapicloud/evo-manager:latest
    restart: always
    ports:
      - "3000:80"
    networks:
      - evo-net

  redis:
    container_name: evo_redis
    image: redis:latest
    restart: always
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - evo_redis:/data
    networks:
      evo-net:
        aliases:
          - evo-redis
      dokploy-network:
        aliases:
          - evo-redis
    expose:
      - "6379"

  evo-postgres:
    container_name: evo_postgres
    image: postgres:15
    restart: always
    env_file:
      - .env
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evo-net
      - dokploy-network
    expose:
      - "5432"

volumes:
  evo_instances:
  evo_redis:
  postgres_data:


networks:
  evo-net:
    name: evo-net
    driver: bridge
  dokploy-network:
    external: true
